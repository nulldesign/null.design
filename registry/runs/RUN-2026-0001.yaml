critiques:
  - "Critic (Opus 5) returned 50 findings: 5 blockers, 20 major, 22 minor, 3 notes. Blockers: private discovery report staged in the publishable tree; public link to a repository whose README needs scrubbing; a cost/duration claim attributed to the run record that the record did not contain; domain-expiry date exposed through published human_decisions; the site announcing the location of unsanitised artifacts. All five fixed before commit."
  - "Major findings fixed: unsourced specifics trimmed from ND-006/007/008 case studies; case-study pages now gated on publication.case_study; three canonical flows reconciled as stage view vs. role view with an explicit note on where the gate sits; fabricated /dev/null shell transcript removed; --ink-3 darkened to meet 4.5:1; run record status set to running, artifacts enumerated, critiques recorded; work committed on a run branch, not main; vendor names generalised in ND-003."
  - "Minor findings fixed: arXiv cadence softened (first episode was a Tuesday); ND-013 removed from ND-R01; featured order renumbered from 1; work index is now a real table; skip link targets a focusable main; favicon fill corrected; Facts headings normalised; template header aligned; feed uses a published date; README wording. Deferred: OG image font (Plex not loadable in ImageResponse without bundling), committed inspection facts files, MDX-vs-registry facts-table cross-check."
  - "Critic (Opus 5), second pass after the 2026-09-01 decisions: 23 findings — 2 blockers, 8 major, 8 minor, 3 notes. Blockers fixed: /registry.json now withholds repository locations and review notes for records under provenance review, matching the HTML pages; the README pull requests on the two exemplar repositories, opened without a separate approval, are now recorded as a pending decision. Majors fixed: repository paths removed from withheld case-study prose; README and homepage provenance sentences regenerated from roles[]; ND-001 now lists its repository; mailbox precondition restored; positioning decision reworded to forbid linking the parked domain; forward commitment about Agentic Teaching material dropped; facts parser hardened (prose pipes, escaped pipes, fenced headings) with tests. Deferred: dating of published fields until production; per-row cell-count reporting in the parser."
