id: ND-R01
title: Agentic Education
slug: agentic-education
status: active
visibility: public
year: { started: 2026, ended: null }
summary: >-
  Agentic Education investigates how computational agents can increase human
  agency in learning without outsourcing the cognitive work through which
  learning occurs.
definition: >-
  Agentic Education investigates how computational agents can increase human
  agency in learning without outsourcing the cognitive work through which
  learning occurs.
principle: The purpose of the agent is to increase the agency of the learner.
workflow: [DEFINE, DECOMPOSE, DELEGATE, OBSERVE, VERIFY, SYNTHESIZE, DEFEND]
questions:
  - Which intellectual tasks should learners delegate?
  - Which tasks should remain human because performing them produces understanding?
  - How should learners verify computational-agent output?
  - How should assessment change when agent use is legitimate?
  - What is agent orchestration literacy?
  - How can agents expand the complexity of problems learners can investigate?
  - How should teachers construct environments containing human and computational agents?
  - How do we distinguish increased learner agency from automated learning?
outputs: [research, essays, classroom experiments, software, protocols, curriculum, professional-development material, products]
